<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>

    <div class="container border border-light rounded-2 col-3 mt-5 ">
        <div class="screen text-end /border border-light" id="screen"></div>
        <div class=" keys /border border-light h-75 d-grid gap-3 ">
            <button onclick="clearScreen()" class=" border-0 fs-xl theme-secondary rounded-circle  ">AC</button>
            <button onclick="press('%')" class=" border-0 fs-xl theme-secondary rounded-circle ">%</button>
            <button onclick="backSpace()" class=" border-0 fs-xl theme-secondary rounded-circle ">&#x232B</button>
            <button onclick="press('/')" class=" border-0 fs-xl theme-secondary rounded-circle ">&#247</button>

            <button onclick="press('7')" class=" border-0 fs-xl rounded-circle ">7</button>
            <button onclick="press('8')" class=" border-0 fs-xl rounded-circle ">8</button>
            <button onclick="press('9')" class=" border-0 fs-xl rounded-circle ">9</button>
            <button onclick="press('*')" class=" border-0 fs-xl rounded-circle btn-solid theme-secondary">X</button>

            <button onclick="press('4')" class=" border-0 fs-xl rounded-circle ">4</button>
            <button onclick="press('5')" class=" border-0 fs-xl rounded-circle ">5</button>
            <button onclick="press('6')" class=" border-0 fs-xl rounded-circle ">6</button>
            <button onclick="press('-')" class=" border-0 fs-xl rounded-circle btn-solid theme-secondary">-</button>

            <button onclick="press('1')" class=" border-0 fs-xl rounded-circle">1</button>
            <button onclick="press('2')" class=" border-0 fs-xl rounded-circle">2</button>
            <button onclick="press('3')" class=" border-0 fs-xl rounded-circle">3</button>
            <button onclick="press('+')" class=" border-0 fs-xl rounded-circle btn-solid theme-secondary">+</button>

            <button onclick="press()" class=" border-0 fs-xl rounded-circle "></button>
            <button onclick="press('0')" class=" border-0 fs-xl rounded-circle ">0</button>
            <button onclick="press('.')" class=" border-0 fs-xl rounded-circle ">.</button>
            <button onclick="calculate()" class=" border-0 fs-xl rounded-circle bg-warning">=</button>

        </div>

    </div>
    

<script src="./index.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</body>
</html>
